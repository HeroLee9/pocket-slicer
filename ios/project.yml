name: PocketSlicer
options:
  bundleIdPrefix: local.pocketslicer
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ''
targets:
  PocketSlicer:
    type: application
    platform: iOS
    sources:
      - path: PocketSlicer
        excludes:
          - Info.plist
      - path: web
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.pocketslicer.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: PocketSlicer/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    dependencies:
      - sdk: Network.framework
      - sdk: WebKit.framework
  PocketSlicerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PocketSlicerTests
    dependencies:
      - target: PocketSlicer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.pocketslicer.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PocketSlicer:
    build:
      targets:
        PocketSlicer: all
        PocketSlicerTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - PocketSlicerTests
    archive:
      config: Release
